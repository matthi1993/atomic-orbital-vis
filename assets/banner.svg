<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </radialGradient>
    <radialGradient id="nucleus" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="60%" stop-color="#c0392b"/>
      <stop offset="100%" stop-color="#7b1a1a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#667eea" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#667eea" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="electron" cx="40%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#a8e6ff"/>
      <stop offset="100%" stop-color="#4fc3f7"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg)" rx="12"/>

  <!-- Subtle grid dots -->
  <g opacity="0.05" fill="#ffffff">
    <circle cx="100" cy="100" r="1"/><circle cx="150" cy="100" r="1"/><circle cx="200" cy="100" r="1"/><circle cx="250" cy="100" r="1"/><circle cx="300" cy="100" r="1"/><circle cx="350" cy="100" r="1"/><circle cx="400" cy="100" r="1"/><circle cx="450" cy="100" r="1"/><circle cx="500" cy="100" r="1"/><circle cx="550" cy="100" r="1"/><circle cx="600" cy="100" r="1"/><circle cx="650" cy="100" r="1"/><circle cx="700" cy="100" r="1"/>
    <circle cx="100" cy="150" r="1"/><circle cx="150" cy="150" r="1"/><circle cx="200" cy="150" r="1"/><circle cx="250" cy="150" r="1"/><circle cx="300" cy="150" r="1"/><circle cx="350" cy="150" r="1"/><circle cx="400" cy="150" r="1"/><circle cx="450" cy="150" r="1"/><circle cx="500" cy="150" r="1"/><circle cx="550" cy="150" r="1"/><circle cx="600" cy="150" r="1"/><circle cx="650" cy="150" r="1"/><circle cx="700" cy="150" r="1"/>
    <circle cx="100" cy="200" r="1"/><circle cx="150" cy="200" r="1"/><circle cx="200" cy="200" r="1"/><circle cx="250" cy="200" r="1"/><circle cx="300" cy="200" r="1"/><circle cx="350" cy="200" r="1"/><circle cx="400" cy="200" r="1"/><circle cx="450" cy="200" r="1"/><circle cx="500" cy="200" r="1"/><circle cx="550" cy="200" r="1"/><circle cx="600" cy="200" r="1"/><circle cx="650" cy="200" r="1"/><circle cx="700" cy="200" r="1"/>
    <circle cx="100" cy="250" r="1"/><circle cx="150" cy="250" r="1"/><circle cx="200" cy="250" r="1"/><circle cx="250" cy="250" r="1"/><circle cx="300" cy="250" r="1"/><circle cx="350" cy="250" r="1"/><circle cx="400" cy="250" r="1"/><circle cx="450" cy="250" r="1"/><circle cx="500" cy="250" r="1"/><circle cx="550" cy="250" r="1"/><circle cx="600" cy="250" r="1"/><circle cx="650" cy="250" r="1"/><circle cx="700" cy="250" r="1"/>
    <circle cx="100" cy="300" r="1"/><circle cx="150" cy="300" r="1"/><circle cx="200" cy="300" r="1"/><circle cx="250" cy="300" r="1"/><circle cx="300" cy="300" r="1"/><circle cx="350" cy="300" r="1"/><circle cx="400" cy="300" r="1"/><circle cx="450" cy="300" r="1"/><circle cx="500" cy="300" r="1"/><circle cx="550" cy="300" r="1"/><circle cx="600" cy="300" r="1"/><circle cx="650" cy="300" r="1"/><circle cx="700" cy="300" r="1"/>
  </g>

  <!-- Central glow -->
  <circle cx="400" cy="200" r="120" fill="url(#glow)"/>

  <!-- Orbital ellipses -->
  <g fill="none" stroke-width="1.2" filter="url(#glowFilter)">
    <!-- Orbit 1 - tilted left -->
    <ellipse cx="400" cy="200" rx="140" ry="50" stroke="#667eea" opacity="0.5" transform="rotate(-30 400 200)"/>
    <!-- Orbit 2 - tilted right -->
    <ellipse cx="400" cy="200" rx="140" ry="50" stroke="#764ba2" opacity="0.5" transform="rotate(30 400 200)"/>
    <!-- Orbit 3 - horizontal -->
    <ellipse cx="400" cy="200" rx="140" ry="50" stroke="#4fc3f7" opacity="0.5" transform="rotate(90 400 200)"/>
  </g>

  <!-- Probability cloud dots (simulating orbital density) -->
  <g fill="#667eea" opacity="0.15">
    <circle cx="385" cy="130" r="2.5"/><circle cx="415" cy="128" r="2"/><circle cx="370" cy="140" r="3"/>
    <circle cx="430" cy="135" r="2"/><circle cx="395" cy="125" r="1.5"/><circle cx="410" cy="145" r="2.5"/>
    <circle cx="375" cy="155" r="2"/><circle cx="425" cy="150" r="3"/><circle cx="390" cy="160" r="1.5"/>
    <circle cx="385" cy="270" r="2.5"/><circle cx="415" cy="272" r="2"/><circle cx="370" cy="260" r="3"/>
    <circle cx="430" cy="265" r="2"/><circle cx="395" cy="275" r="1.5"/><circle cx="410" cy="255" r="2.5"/>
    <circle cx="375" cy="245" r="2"/><circle cx="425" cy="250" r="3"/><circle cx="390" cy="240" r="1.5"/>
    <circle cx="340" cy="185" r="2"/><circle cx="460" cy="190" r="2.5"/><circle cx="335" cy="210" r="1.5"/>
    <circle cx="465" cy="215" r="2"/><circle cx="345" cy="195" r="3"/><circle cx="455" cy="205" r="2"/>
  </g>

  <!-- Nucleus -->
  <circle cx="400" cy="200" r="14" fill="url(#nucleus)" filter="url(#glowFilter)"/>
  <circle cx="396" cy="195" r="4" fill="#ff8a80" opacity="0.4"/>

  <!-- Electrons on orbits -->
  <g filter="url(#glowFilter)">
    <circle cx="310" cy="148" r="5" fill="url(#electron)"/>
    <circle cx="310" cy="148" r="8" fill="#4fc3f7" opacity="0.2"/>

    <circle cx="490" cy="252" r="5" fill="url(#electron)"/>
    <circle cx="490" cy="252" r="8" fill="#4fc3f7" opacity="0.2"/>

    <circle cx="400" cy="60" r="5" fill="url(#electron)"/>
    <circle cx="400" cy="60" r="8" fill="#4fc3f7" opacity="0.2"/>
  </g>

  <!-- Quantum number labels -->
  <g font-family="monospace" font-size="11" fill="#667eea" opacity="0.3">
    <text x="60" y="360">n=1  l=0  m=0</text>
    <text x="620" y="40">ψ(r,θ,φ)</text>
  </g>
</svg>
