<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Atom Orbital Visualizer — WebGPU Compute Shader</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; color: #eee; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #controls {
    position: absolute; top: 16px; left: 16px;
    background: rgba(10, 10, 30, 0.85); backdrop-filter: blur(8px);
    border: 1px solid rgba(100, 140, 255, 0.25); border-radius: 12px;
    padding: 20px; width: 300px; z-index: 10;
    max-height: calc(100vh - 32px); overflow-y: auto;
  }
  #controls h2 { font-size: 16px; margin-bottom: 12px; color: #8af; }
  .control-group { margin-bottom: 14px; }
  .control-group label { display: block; font-size: 12px; margin-bottom: 4px; color: #aac; }
  .control-group .row { display: flex; align-items: center; gap: 8px; }
  .control-group input[type=range] { flex: 1; accent-color: #58f; }
  .control-group .val { font-size: 12px; min-width: 32px; text-align: right; color: #8cf; }
  .section { border-top: 1px solid rgba(100, 140, 255, 0.15); padding-top: 12px; margin-top: 12px; }
  .section h3 { font-size: 13px; margin-bottom: 8px; color: #7af; }
  #info { position: absolute; bottom: 16px; left: 16px; font-size: 11px; color: #556; }
  #no-webgpu {
    display: none; position: fixed; inset: 0;
    background: #111; z-index: 1000;
    justify-content: center; align-items: center;
    font-size: 20px; color: #f66; text-align: center; padding: 40px;
  }
</style>
</head>
<body>

<div id="no-webgpu">
  WebGPU is not available in this browser.<br>
  <span style="font-size:14px;color:#888;margin-top:8px;display:inline-block">Try Chrome 113+ or Edge 113+ with WebGPU enabled.</span>
</div>

<div id="controls">
  <h2>Atom Orbital Visualizer</h2>

  <div class="control-group">
    <label>Quantum Number n (shell)</label>
    <div class="row">
      <input type="range" id="qn" min="1" max="5" step="1" value="2">
      <span class="val" id="qn_val">2</span>
    </div>
  </div>

  <div class="control-group">
    <label>Quantum Number l (angular)</label>
    <div class="row">
      <input type="range" id="ql" min="0" max="4" step="1" value="1">
      <span class="val" id="ql_val">1</span>
    </div>
  </div>

  <div class="control-group">
    <label>Quantum Number m (magnetic)</label>
    <div class="row">
      <input type="range" id="qm" min="-4" max="4" step="1" value="0">
      <span class="val" id="qm_val">0</span>
    </div>
  </div>

  <div class="section">
    <h3>Rendering</h3>
    <div class="control-group">
      <label>Particle Count (×1000)</label>
      <div class="row">
        <input type="range" id="count" min="10" max="500" step="10" value="200">
        <span class="val" id="count_val">200k</span>
      </div>
    </div>
    <div class="control-group">
      <label>Density Threshold</label>
      <div class="row">
        <input type="range" id="threshold" min="0" max="100" step="1" value="15">
        <span class="val" id="threshold_val">0.15</span>
      </div>
    </div>
    <div class="control-group">
      <label>Orbital Scale</label>
      <div class="row">
        <input type="range" id="scale" min="1" max="30" step="1" value="10">
        <span class="val" id="scale_val">10</span>
      </div>
    </div>
    <div class="control-group">
      <label>Point Size</label>
      <div class="row">
        <input type="range" id="psize" min="1" max="8" step="0.5" value="2">
        <span class="val" id="psize_val">2.0</span>
      </div>
    </div>
    <div class="control-group">
      <label>Rotation Speed</label>
      <div class="row">
        <input type="range" id="rotspeed" min="0" max="100" step="1" value="20">
        <span class="val" id="rotspeed_val">0.20</span>
      </div>
    </div>
  </div>
</div>

<div id="info">Drag to rotate · Scroll to zoom · WebGPU Compute Shader</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.webgpu.min.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.webgpu.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─── WebGPU Check ───────────────────────────────────────
if (!navigator.gpu) {
  document.getElementById('no-webgpu').style.display = 'flex';
  throw new Error('WebGPU not supported');
}

// ─── Parameters ─────────────────────────────────────────
const params = {
  n: 2, l: 1, m: 0,
  count: 200000,
  threshold: 0.15,
  scale: 10.0,
  pointSize: 2.0,
  rotSpeed: 0.2,
};

// ─── Slider Wiring ──────────────────────────────────────
function wire(id, key, map = v => +v, fmt = v => v) {
  const el = document.getElementById(id);
  const val = document.getElementById(id + '_val');
  el.addEventListener('input', () => {
    params[key] = map(el.value);
    val.textContent = fmt(el.value);
    if (key === 'n') constrainQuantumNumbers();
    if (key === 'l') constrainM();
    if (['n', 'l', 'm', 'count', 'threshold', 'scale'].includes(key)) regenerate();
  });
}

function constrainQuantumNumbers() {
  const lSlider = document.getElementById('ql');
  lSlider.max = params.n - 1;
  if (params.l >= params.n) { params.l = params.n - 1; lSlider.value = params.l; document.getElementById('ql_val').textContent = params.l; }
  constrainM();
}

function constrainM() {
  const mSlider = document.getElementById('qm');
  mSlider.min = -params.l; mSlider.max = params.l;
  if (params.m < -params.l) { params.m = -params.l; mSlider.value = params.m; document.getElementById('qm_val').textContent = params.m; }
  if (params.m > params.l) { params.m = params.l; mSlider.value = params.m; document.getElementById('qm_val').textContent = params.m; }
}

wire('qn', 'n', v => +v, v => v);
wire('ql', 'l', v => +v, v => v);
wire('qm', 'm', v => +v, v => v);
wire('count', 'count', v => v * 1000, v => v + 'k');
wire('threshold', 'threshold', v => v / 100, v => (v / 100).toFixed(2));
wire('scale', 'scale', v => +v, v => v);
wire('psize', 'pointSize', v => +v, v => (+v).toFixed(1));
wire('rotspeed', 'rotSpeed', v => v / 100, v => (v / 100).toFixed(2));

// ─── Hydrogen Orbital Math (CPU side for particle seeding) ──
// We compute positions on the GPU via compute shader, but we need
// some math utilities.

// Associated Legendre polynomial P_l^m(x)
function assocLegendre(l, m, x) {
  let pmm = 1.0;
  if (m > 0) {
    const somx2 = Math.sqrt(1.0 - x * x);
    let fact = 1.0;
    for (let i = 0; i < m; i++) { pmm *= -fact * somx2; fact += 2.0; }
  }
  if (l === m) return pmm;
  let pmmp1 = x * (2 * m + 1) * pmm;
  if (l === m + 1) return pmmp1;
  let pll = 0;
  for (let ll = m + 2; ll <= l; ll++) {
    pll = (x * (2 * ll - 1) * pmmp1 - (ll + m - 1) * pmm) / (ll - m);
    pmm = pmmp1; pmmp1 = pll;
  }
  return pll;
}

function factorial(n) { let f = 1; for (let i = 2; i <= n; i++) f *= i; return f; }

// Real spherical harmonic Y_l^m(theta, phi)
function sphericalHarmonic(l, m, theta, phi) {
  const absm = Math.abs(m);
  const norm = Math.sqrt((2 * l + 1) / (4 * Math.PI) * factorial(l - absm) / factorial(l + absm));
  const plm = assocLegendre(l, absm, Math.cos(theta));
  if (m > 0) return norm * plm * Math.cos(m * phi) * Math.SQRT2;
  if (m < 0) return norm * plm * Math.sin(absm * phi) * Math.SQRT2;
  return norm * plm;
}

// Laguerre polynomial L_p^k(x)
function laguerre(p, k, x) {
  if (p === 0) return 1;
  if (p === 1) return 1 + k - x;
  let lk0 = 1, lk1 = 1 + k - x;
  for (let i = 2; i <= p; i++) {
    const lk2 = ((2 * i - 1 + k - x) * lk1 - (i - 1 + k) * lk0) / i;
    lk0 = lk1; lk1 = lk2;
  }
  return lk1;
}

// Radial wave function R_nl(r) (hydrogen-like, a0 = 1)
function radialWave(n, l, r) {
  const rho = 2 * r / n;
  const norm = Math.sqrt(Math.pow(2 / n, 3) * factorial(n - l - 1) / (2 * n * factorial(n + l)));
  return norm * Math.exp(-rho / 2) * Math.pow(rho, l) * laguerre(n - l - 1, 2 * l + 1, rho);
}

// Probability density |psi|^2 at (r, theta, phi)
function psiSquared(n, l, m, r, theta, phi) {
  const R = radialWave(n, l, r);
  const Y = sphericalHarmonic(l, m, theta, phi);
  return R * R * Y * Y;
}

// ─── Generate Particle Positions (rejection sampling) ───
function generatePositions(n, l, m, count, scale, threshold) {
  const positions = new Float32Array(count * 4);
  const colors = new Float32Array(count * 4);
  const rMax = scale * n * n; // Maximum r to sample
  let maxPsi = 0;

  // Estimate max psi^2 for normalization
  for (let i = 0; i < 5000; i++) {
    const r = Math.random() * rMax;
    const theta = Math.random() * Math.PI;
    const phi = Math.random() * 2 * Math.PI;
    const p = psiSquared(n, l, m, r, theta, phi) * r * r;
    if (p > maxPsi) maxPsi = p;
  }

  let idx = 0;
  let attempts = 0;
  const maxAttempts = count * 200;

  while (idx < count && attempts < maxAttempts) {
    attempts++;
    const r = Math.random() * rMax;
    const theta = Math.acos(2 * Math.random() - 1);
    const phi = Math.random() * 2 * Math.PI;
    const psi2 = psiSquared(n, l, m, r, theta, phi) * r * r;
    const prob = maxPsi > 0 ? psi2 / maxPsi : 0;

    if (prob < threshold) continue;
    if (Math.random() > prob) continue;

    const x = r * Math.sin(theta) * Math.cos(phi);
    const y = r * Math.sin(theta) * Math.sin(phi);
    const z = r * Math.cos(theta);

    positions[idx * 4 + 0] = x;
    positions[idx * 4 + 1] = y;
    positions[idx * 4 + 2] = z;
    positions[idx * 4 + 3] = 1.0;

    // Color based on sign of wave function (phase coloring)
    const R_val = radialWave(n, l, r);
    const Y_val = sphericalHarmonic(l, m, theta, phi);
    const sign = R_val * Y_val;
    const t = Math.min(prob * 2.0, 1.0);

    if (sign >= 0) {
      colors[idx * 4 + 0] = 0.2 + 0.6 * t;  // R
      colors[idx * 4 + 1] = 0.4 + 0.5 * t;  // G
      colors[idx * 4 + 2] = 1.0;              // B
      colors[idx * 4 + 3] = 0.4 + 0.6 * t;
    } else {
      colors[idx * 4 + 0] = 1.0;              // R
      colors[idx * 4 + 1] = 0.3 + 0.4 * t;  // G
      colors[idx * 4 + 2] = 0.2 + 0.3 * t;  // B
      colors[idx * 4 + 3] = 0.4 + 0.6 * t;
    }
    idx++;
  }

  return { positions, colors, actual: idx };
}

// ─── Three.js WebGPU Setup ──────────────────────────────
const renderer = new THREE.WebGPURenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x050510);
document.body.appendChild(renderer.domElement);

await renderer.init();

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 15, 30);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 200;

// ─── Compute Shader for particle animation ──────────────
// The compute shader handles per-frame particle animation (gentle oscillation / drift)
// while the heavy orbital sampling is done on CPU via rejection sampling.

const computeShaderCode = /* wgsl */`
  struct Particle {
    pos: vec4<f32>,
    vel: vec4<f32>,
  };

  struct Uniforms {
    time: f32,
    dt: f32,
    count: f32,
    rotSpeed: f32,
  };

  @group(0) @binding(0) var<storage, read_write> particles: array<Particle>;
  @group(0) @binding(1) var<uniform> uniforms: Uniforms;

  @compute @workgroup_size(256)
  fn main(@builtin(global_invocation_id) id: vec3<u32>) {
    let i = id.x;
    if (i >= u32(uniforms.count)) { return; }

    var p = particles[i];
    let r = length(p.pos.xyz);

    // Gentle orbital rotation around Y axis
    let angle = uniforms.dt * uniforms.rotSpeed * (1.0 + 0.3 / max(r, 0.5));
    let cosA = cos(angle);
    let sinA = sin(angle);
    let newX = p.pos.x * cosA - p.pos.z * sinA;
    let newZ = p.pos.x * sinA + p.pos.z * cosA;
    p.pos.x = newX;
    p.pos.z = newZ;

    // Subtle breathing / oscillation (only when rotation is active)
    if (uniforms.rotSpeed > 0.0) {
      let breath = 1.0 + 0.003 * sin(uniforms.time * 0.5 + r * 0.2) * uniforms.rotSpeed;
      p.pos.x *= breath;
      p.pos.y *= breath;
      p.pos.z *= breath;
    }

    particles[i] = p;
  }
`;

// ─── GPU Resources ──────────────────────────────────────
const device = renderer.backend.device;
let particleCount = params.count;
let particleBuffer, uniformBuffer, computePipeline, bindGroup;

const uniformData = new Float32Array(4); // time, dt, count, rotSpeed

function createComputeResources(count) {
  particleCount = count;

  // Particle buffer: each particle = pos(vec4) + vel(vec4) = 32 bytes
  particleBuffer = device.createBuffer({
    size: count * 32,
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC,
  });

  uniformBuffer = device.createBuffer({
    size: 16,
    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
  });

  const shaderModule = device.createShaderModule({ code: computeShaderCode });

  const bindGroupLayout = device.createBindGroupLayout({
    entries: [
      { binding: 0, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'storage' } },
      { binding: 1, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'uniform' } },
    ],
  });

  computePipeline = device.createComputePipeline({
    layout: device.createPipelineLayout({ bindGroupLayouts: [bindGroupLayout] }),
    compute: { module: shaderModule, entryPoint: 'main' },
  });

  bindGroup = device.createBindGroup({
    layout: bindGroupLayout,
    entries: [
      { binding: 0, resource: { buffer: particleBuffer } },
      { binding: 1, resource: { buffer: uniformBuffer } },
    ],
  });
}

function uploadParticles(positions) {
  // Interleave positions with zero velocities
  const data = new Float32Array(particleCount * 8);
  for (let i = 0; i < particleCount; i++) {
    data[i * 8 + 0] = positions[i * 4 + 0];
    data[i * 8 + 1] = positions[i * 4 + 1];
    data[i * 8 + 2] = positions[i * 4 + 2];
    data[i * 8 + 3] = positions[i * 4 + 3];
    // vel = 0
  }
  device.queue.writeBuffer(particleBuffer, 0, data);
}

// ─── Three.js Points Geometry (read from compute buffer) ─
let pointsGeometry, pointsMaterial, pointsMesh;
let positionArray, colorArray;

function createPointCloud(count, colors) {
  if (pointsMesh) scene.remove(pointsMesh);

  positionArray = new Float32Array(count * 3);
  colorArray = new Float32Array(count * 3);

  // Copy initial colors
  for (let i = 0; i < count; i++) {
    colorArray[i * 3 + 0] = colors[i * 4 + 0];
    colorArray[i * 3 + 1] = colors[i * 4 + 1];
    colorArray[i * 3 + 2] = colors[i * 4 + 2];
  }

  pointsGeometry = new THREE.BufferGeometry();
  pointsGeometry.setAttribute('position', new THREE.BufferAttribute(positionArray, 3));
  pointsGeometry.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));

  pointsMaterial = new THREE.PointsMaterial({
    size: params.pointSize,
    vertexColors: true,
    transparent: true,
    opacity: 0.85,
    sizeAttenuation: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });

  pointsMesh = new THREE.Points(pointsGeometry, pointsMaterial);
  scene.add(pointsMesh);
}

// ─── Readback buffer ────────────────────────────────────
let readbackBuffer;

function createReadbackBuffer(count) {
  if (readbackBuffer) readbackBuffer.destroy();
  readbackBuffer = device.createBuffer({
    size: count * 32,
    usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST,
  });
}

// ─── Nucleus ────────────────────────────────────────────
const nucleusGeo = new THREE.SphereGeometry(0.3, 32, 32);
const nucleusMat = new THREE.MeshBasicMaterial({ color: 0xffffaa });
const nucleus = new THREE.Mesh(nucleusGeo, nucleusMat);
scene.add(nucleus);

// Glow
const glowGeo = new THREE.SphereGeometry(0.6, 32, 32);
const glowMat = new THREE.MeshBasicMaterial({ color: 0xffffcc, transparent: true, opacity: 0.15 });
const glow = new THREE.Mesh(glowGeo, glowMat);
scene.add(glow);

// ─── Regenerate Orbital ─────────────────────────────────
let generating = false;

async function regenerate() {
  if (generating) return;
  generating = true;

  const { n, l, m, count, threshold, scale } = params;
  const { positions, colors, actual } = generatePositions(n, l, m, count, scale, threshold);

  const usedCount = Math.max(actual, 1);

  createComputeResources(usedCount);
  createReadbackBuffer(usedCount);
  uploadParticles(positions);
  createPointCloud(usedCount, colors);

  generating = false;
}

await regenerate();

// ─── Render Loop ────────────────────────────────────────
let lastTime = performance.now();
let elapsedTime = 0;
let readbackPending = false;

async function animate() {
  requestAnimationFrame(animate);

  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  elapsedTime += dt;

  controls.update();
  pointsMaterial.size = params.pointSize;

  // Run compute shader
  uniformData[0] = elapsedTime;
  uniformData[1] = dt;
  uniformData[2] = particleCount;
  uniformData[3] = params.rotSpeed;
  device.queue.writeBuffer(uniformBuffer, 0, uniformData);

  const commandEncoder = device.createCommandEncoder();
  const pass = commandEncoder.beginComputePass();
  pass.setPipeline(computePipeline);
  pass.setBindGroup(0, bindGroup);
  pass.dispatchWorkgroups(Math.ceil(particleCount / 256));
  pass.end();

  // Copy to readback
  if (!readbackPending) {
    commandEncoder.copyBufferToBuffer(particleBuffer, 0, readbackBuffer, 0, particleCount * 32);
  }

  device.queue.submit([commandEncoder.finish()]);

  // Read back positions
  if (!readbackPending) {
    readbackPending = true;
    readbackBuffer.mapAsync(GPUMapMode.READ).then(() => {
      const data = new Float32Array(readbackBuffer.getMappedRange());
      for (let i = 0; i < particleCount; i++) {
        positionArray[i * 3 + 0] = data[i * 8 + 0];
        positionArray[i * 3 + 1] = data[i * 8 + 1];
        positionArray[i * 3 + 2] = data[i * 8 + 2];
      }
      readbackBuffer.unmap();
      pointsGeometry.attributes.position.needsUpdate = true;
      readbackPending = false;
    }).catch(() => { readbackPending = false; });
  }

  // Nucleus pulse
  const pulse = 1.0 + 0.05 * Math.sin(elapsedTime * 2);
  nucleus.scale.setScalar(pulse);
  glow.scale.setScalar(pulse * 1.8);

  renderer.render(scene, camera);
}

animate();

// ─── Resize ─────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
